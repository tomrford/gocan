name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: go.mod

      # 7.0 Azure kernels ship vcan in linux-modules and publish no
      # linux-modules-extra package for that version. Older kernels still
      # keep vcan in linux-modules-extra, so install that only if modprobe fails.
      - name: Set up virtual CAN
        run: |
          kernel="$(uname -r)"
          echo "kernel ${kernel}"
          if sudo modprobe vcan; then
            echo "loaded vcan from the running kernel"
          else
            echo "vcan is not loaded; installing modules for ${kernel}"
            sudo apt-get update
            extra="linux-modules-extra-${kernel}"
            if sudo apt-cache show "$extra" >/dev/null 2>&1; then
              sudo apt-get install --no-install-recommends -y "$extra"
            else
              echo "${extra} is not published; installing linux-modules-${kernel}"
              sudo apt-get install --no-install-recommends -y "linux-modules-${kernel}"
            fi
            sudo modprobe vcan
          fi
          sudo ip link add dev vcan0 type vcan
          sudo ip link set dev vcan0 mtu 72 up
          ip -details link show vcan0

      - name: Test
        env:
          GOCAN_VCAN_INTERFACE: vcan0
        run: |
          go test -race ./...
          set -o pipefail
          go test -race -count=1 -v ./drivers/internal/socketcan -run 'TestVCanConformance/frame_shapes/(classical_dlc_15|remote_dlc_9)$' | tee vcan-dlc.txt
          grep -q '^--- PASS: TestVCanConformance/frame_shapes/classical_dlc_15 ' vcan-dlc.txt
          grep -q '^--- PASS: TestVCanConformance/frame_shapes/remote_dlc_9 ' vcan-dlc.txt

      - name: Vet
        run: go vet ./...

      - name: Check formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "gofmt required: $unformatted"
            exit 1
          fi

      - name: Compile Windows targets
        run: |
          for arch in amd64 arm64 386; do
            echo "Compiling windows/$arch"
            env CGO_ENABLED=0 GOOS=windows GOARCH="$arch" go test -exec=true ./...
          done
