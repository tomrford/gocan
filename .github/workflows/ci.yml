name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: go.mod

      - name: Set up virtual CAN
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y "linux-modules-extra-$(uname -r)"
          sudo modprobe vcan
          sudo ip link add dev vcan0 type vcan
          sudo ip link set dev vcan0 mtu 72 up

      - name: Test
        env:
          GOCAN_VCAN_INTERFACE: vcan0
        run: go test -race ./...

      - name: Vet
        run: go vet ./...

      - name: Check formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "gofmt required: $unformatted"
            exit 1
          fi

      - name: Compile Windows targets
        run: |
          for arch in amd64 arm64 386; do
            echo "Compiling windows/$arch"
            env CGO_ENABLED=0 GOOS=windows GOARCH="$arch" go test -exec=true ./...
          done
